server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O multer do backend aceita até 10 MB por documento; o default do nginx é
    # 1 MB, o que devolveria 413 ao importar uma nota escaneada.
    client_max_body_size 12M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API no mesmo origin do frontend — dispensa CORS no navegador.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Geração de XLSX e importação de lote de documentos podem passar de 60s.
        proxy_connect_timeout 10s;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # Regerado a cada start do container: nunca pode ser cacheado, senão o
    # navegador guarda a configuração de um ambiente anterior.
    location = /config.js {
        # Só add_header: `expires -1` emitiria um segundo Cache-Control.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Assets do Vite têm hash no nome, então podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html referencia os assets com hash, então NÃO pode ser cacheado:
    # com ele em cache o navegador continua carregando o bundle da versão
    # anterior depois de um deploy — e, se o arquivo antigo já não existir, a
    # aplicação simplesmente não sobe.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
